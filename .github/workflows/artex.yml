name: artex

on:
  push:
    branches:
      - main
    paths:
      - artex/*
      - .github/workflows/artex.yml
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

env:
  BUILD_VERSION: "v0.7.0"
  # 3.15: bbot deps (zstandard) publish no cp315 wheels yet
  PYTHON_VERSION: "3.14"
  BBOT_VERSION: "3.0.2"
  PLAYWRIGHT_MCP_VERSION: "0.0.83"
  PLAYWRIGHT_CLI_VERSION: "0.1.22"
  # Recon toolbox: a version bump is the version plus both per-arch digests.
  NUCLEI_VERSION: "v3.11.1"
  NUCLEI_SHA256_AMD64: "ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6"
  NUCLEI_SHA256_ARM64: "8044e3d9768ba0a744b2872c1a87e813006f013da97ca9f50f7661a4203bec07"
  HTTPX_VERSION: "v1.12.0"
  HTTPX_SHA256_AMD64: "9d8439e8b6c9aa7d1e2314817a392e00d5178da3af5652f7475f88868f418f76"
  HTTPX_SHA256_ARM64: "fd7b123c1dfbc3d69f19f524e4eebcd6ec06b9a6cbd56813c76f11645197331e"
  SUBFINDER_VERSION: "v2.17.0"
  SUBFINDER_SHA256_AMD64: "a39c3e5c7a26ef3c430915c4d6cbf7716a00f26769a75e9405aba796142eba37"
  SUBFINDER_SHA256_ARM64: "24913d49dddc1d3a5e99a4a7580da5be980959b9415b96f52c4f7f4124392190"
  KATANA_VERSION: "v1.8.0"
  KATANA_SHA256_AMD64: "cb027ae99d0757061b70c07a15c7a80f62c5a535ab52c4a329f80c4b0a7309d2"
  KATANA_SHA256_ARM64: "80e269210727a855511ffac8dfb01297b2344742acec71a35e8ba4a67a90f0f2"
  FFUF_VERSION: "v2.3.0"
  FFUF_SHA256_AMD64: "b2a3c725fcb9da175159682f54d6e9149f2905b00d84d155e7efc5d599975ceb"
  FFUF_SHA256_ARM64: "e2d712615d53da797ee929006e41f2df5a7960a5353133db9c150ddaa22ae4e8"
  DALFOX_VERSION: "v3.2.4"
  DALFOX_SHA256_AMD64: "c11cfd2f8261973f0a2a2a1eba5a147ce77712a29acfa6343f9847fb8bb7eca2"
  DALFOX_SHA256_ARM64: "fd56b0b7da2d06868cd73b504f41d21314629feffcd5bdc97718db1c9dd2fa70"
  # legba: bbot's module pins it, but bbot fetches a non-existent asset on amd64
  LEGBA_VERSION: "1.1.1"
  LEGBA_SHA256_AMD64: "7a01c975e5329e8f819ca552b9b734102ffbd30f1b6f7739b1cf1108a22eb096"
  LEGBA_SHA256_ARM64: "dd50d37f1d6d7c4e64460816b46d5790223c6a4583fa2230da7bd506f272d9e0"
  SQLMAP_VERSION: "1.9.9"
  SQLMAP_COMMIT: "cceda39208b5aad478de2c3f731df4239d9881f6"
  DOCKER_CLI_EXPERIMENTAL: enabled
  REPOSITORY: ${{ github.actor }}/${{ github.workflow }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Native runner per platform: the bbot and Playwright installs are far
    # too slow under QEMU.
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            ansible-galaxy-ng.s3.dualstack.us-east-1.amazonaws.com:443
            archive.ubuntu.com:80
            artifactcache.actions.githubusercontent.com:443
            auth.docker.io:443
            cdn.playwright.dev:443
            codeload.github.com:443
            dl-cdn.alpinelinux.org:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            files.pythonhosted.org:443
            galaxy.ansible.com:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            pkg-containers.githubusercontent.com:443
            playwright.download.prss.microsoft.com:443
            ports.ubuntu.com:80
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            publicsuffix.org:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            security.ubuntu.com:80
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare platform name
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Setup Buildx
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Set Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REPOSITORY }}
          labels: |
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ env.REPOSITORY }}

      - name: GitHub login
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workflow }}
          file: ${{ github.workflow }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION
            PYTHON_VERSION
            BBOT_VERSION
            PLAYWRIGHT_MCP_VERSION
            PLAYWRIGHT_CLI_VERSION
            NUCLEI_VERSION
            NUCLEI_SHA256_AMD64
            NUCLEI_SHA256_ARM64
            HTTPX_VERSION
            HTTPX_SHA256_AMD64
            HTTPX_SHA256_ARM64
            SUBFINDER_VERSION
            SUBFINDER_SHA256_AMD64
            SUBFINDER_SHA256_ARM64
            KATANA_VERSION
            KATANA_SHA256_AMD64
            KATANA_SHA256_ARM64
            FFUF_VERSION
            FFUF_SHA256_AMD64
            FFUF_SHA256_ARM64
            DALFOX_VERSION
            DALFOX_SHA256_AMD64
            DALFOX_SHA256_ARM64
            LEGBA_VERSION
            LEGBA_SHA256_AMD64
            LEGBA_SHA256_ARM64
            SQLMAP_VERSION
            SQLMAP_COMMIT
          sbom: true
          provenance: true
          labels: ${{ steps.docker_meta.outputs.labels }}
          # Push untagged by digest; the merge job stitches the digests into the
          # tagged manifest lists so :latest is never overwritten per-platform.
          outputs: type=image,name=ghcr.io/${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: GitHub login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest lists
        working-directory: /tmp/digests
        run: |
          digests=()
          for d in *; do digests+=("ghcr.io/${REPOSITORY}@sha256:${d}"); done
          docker buildx imagetools create \
            -t "ghcr.io/${REPOSITORY}:${BUILD_VERSION}" \
            -t "ghcr.io/${REPOSITORY}:latest" \
            "${digests[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/${REPOSITORY}:latest"

name: nginx-distroless

on:
  push:
    branches:
      - main
    paths:
      - done/nginx-distroless/*
      - .github/workflows/nginx-distroless.yml
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

env:
  BUILD_VERSION: "1.21.3"
  BUILD_STABLE_VERSION: "1.20.1"
  DOCKER_CLI_EXPERIMENTAL: enabled
  REPOSITORY: ${{ github.actor }}/${{ github.workflow }}

permissions:
  contents: read

jobs:
  build:
    # Build each variant/platform pair on its own native runner rather than
    # emulating with QEMU. amd64 and arm64 are the only targets; s390x was
    # dropped along with the emulation.
    strategy:
      fail-fast: false
      matrix:
        variant: [latest, stable]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
          - variant: latest
            dockerfile: Dockerfile
          - variant: stable
            dockerfile: Dockerfile.stable
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare platform name
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Setup Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REPOSITORY }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ env.REPOSITORY }}

      - name: GitHub login
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

#      - name: DockerHub login
#        if: ${{ github.event_name != 'pull_request' }}
#        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
#        with:
#          username: ${{ secrets.DOCKERHUB_USERNAME }}
#          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push by digest (${{ matrix.variant }})
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # the nginx-distroless image lives under done/ now
          context: done/${{ github.workflow }}
          file: done/${{ github.workflow }}/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # each Dockerfile declares only the ARG it needs; the other is ignored
          build-args: |
            BUILD_VERSION
            BUILD_STABLE_VERSION
          sbom: true
          provenance: true
          labels: ${{ steps.docker_meta.outputs.labels }}
          # Push untagged by digest; the merge job stitches the digests into the
          # tagged manifest lists so :latest is never overwritten per-platform.
          outputs: type=image,name=ghcr.io/${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        variant: [latest, stable]
    runs-on: ubuntu-26.04
    permissions:
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: GitHub login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest lists (${{ matrix.variant }})
        working-directory: /tmp/digests
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "${VARIANT}" = "stable" ]; then
            version="${BUILD_STABLE_VERSION}"
          else
            version="${BUILD_VERSION}"
          fi
          digests=()
          for d in *; do digests+=("ghcr.io/${REPOSITORY}@sha256:${d}"); done
          docker buildx imagetools create \
            -t "ghcr.io/${REPOSITORY}:${version}" \
            -t "ghcr.io/${REPOSITORY}:${VARIANT}" \
            "${digests[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/${REPOSITORY}:${{ matrix.variant }}"

### 20250930195232 ###

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      actions-deps:
        patterns:
          - "*"

  # Python dependencies. The uv ecosystem reads pyproject.toml and uv.lock,
  # which are the source of truth here. Unlike pip it does not parse
  # requirements files, so the frozen awscli 1.16.14 pin and memray's upstream
  # dev files are no longer updated. Both are meant to stay where they are, so
  # that is the wanted behaviour rather than a gap.
  #
  # shodan is deliberately NOT in this list - it has its own entry below so its
  # setuptools pin can be exempted without suppressing setuptools elsewhere.
  # Any new app directory needs adding to one of the batches.
  #
  # The directories are split into batches because Dependabot checks every
  # locked package one by one, and a single job over all of them ran past the
  # roughly 55 minute limit and was cancelled every day. Each batch is sized to
  # finish in about 30 minutes, at roughly 3.5 minutes per directory plus 5
  # seconds per locked package.
  - package-ecosystem: "uv"
    directories:
      - "/ai-hedge-fund"
      - "/finanace_dl"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-1:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/aranet4"
      - "/cantools"
      - "/cryptolyzer"
      - "/greynoise"
      - "/pyaranet4"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-2:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/autoflake"
      - "/codespell"
      - "/hdbcli"
      - "/mlx"
      - "/pyupgrade"
      - "/uv"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-3:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/awscli"
      - "/badkeys"
      - "/internetarchive"
      - "/jc"
      - "/notdiamond"
      - "/puncia"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-4:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/bgperf2"
      - "/revchatgpt"
      - "/scrapeghost"
      - "/ssh-mitm"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-5:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/claude-engineer"
      - "/routellm"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-6:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/datasette"
      - "/dnsrecon"
      - "/posting"
      - "/pshtt"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-7:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/deepdiff"
      - "/openbbterminal"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-8:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/diagrams"
      - "/dnsvalidator"
      - "/huggingface-cli"
      - "/memray"
      - "/python-matter-server"
      - "/wtfis"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-9:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/dnsdiag"
      - "/dnstwist"
      - "/llm"
      - "/pyinfra"
      - "/sgpt"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-10:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/gallery-dl"
      - "/prowler"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-11:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/ilab"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-12:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/llama-fs"
      - "/pwnagotchi"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-13:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/paperless-ngx"
      - "/wolverine"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-14:
        patterns:
          - "*"

  # shodan only: its __main__ imports pkg_resources, which setuptools removed in
  # 81.0.0, so "shodan --help" breaks above 80.x. Upstream fix is in flight at
  # https://github.com/achillean/shodan-python/pull/253 - drop this entry once
  # that lands and the pin comes off shodan/pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/shodan"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python:
        patterns:
          - "*"
    ignore:
      - dependency-name: "setuptools"
        versions: [">=81.0.0"]

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/*"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      docker:
        patterns:
          - "*"

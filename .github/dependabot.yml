### 20250930195232 ###

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      actions-deps:
        patterns:
          - "*"

  # Python dependencies. The uv ecosystem reads pyproject.toml and uv.lock,
  # which are the source of truth here. Unlike pip it does not parse
  # requirements files, so the frozen awscli 1.16.14 pin and memray's upstream
  # dev files are no longer updated. Both are meant to stay where they are, so
  # that is the wanted behaviour rather than a gap.
  #
  # shodan, awscli, pshtt and sgpt are deliberately NOT in these batches - they
  # share the entry below, which carries the ignore rules they need.
  # Any new app directory needs adding to one of the batches.
  #
  # ai-hedge-fund, ilab and python-matter-server are deliberately absent. Their
  # dependencies are the git-sourced package itself or are all held back by its
  # pins, so every Dependabot version update for them failed. The weekly
  # scripts/updatePythonDepsUV.sh still updates their locks.
  #
  # The directories are split into three batches because a single job over all
  # of them ran past the roughly 55 minute limit and was cancelled every day.
  # Two batches did not fit either: on 2026-10-27 the larger one was cancelled
  # at 55.7 minutes and the other took 37. The 43 directories here need about
  # 86 minutes of work in total plus about 100 seconds of start-up per job, so
  # three batches are expected to take about 33 minutes each. Per-directory
  # time varies with how many updates are pending, so if a batch starts to
  # approach 45 minutes, add a fourth.
  - package-ecosystem: "uv"
    directories:
      - "/aranet4"
      - "/autoflake"
      - "/badkeys"
      - "/deepdiff"
      - "/huggingface-cli"
      - "/internetarchive"
      - "/jc"
      - "/llama-fs"
      - "/prowler"
      - "/puncia"
      - "/pyinfra"
      - "/pyupgrade"
      - "/revchatgpt"
      - "/ssh-mitm"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-1:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/bgperf2"
      - "/cantools"
      - "/claude-engineer"
      - "/diagrams"
      - "/dnsrecon"
      - "/dnsvalidator"
      - "/finanace_dl"
      - "/hdbcli"
      - "/llm"
      - "/memray"
      - "/mlx"
      - "/paperless-ngx"
      - "/pyaranet4"
      - "/scrapeghost"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-2:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/codespell"
      - "/cryptolyzer"
      - "/datasette"
      - "/dnsdiag"
      - "/dnstwist"
      - "/gallery-dl"
      - "/greynoise"
      - "/notdiamond"
      - "/openbbterminal"
      - "/posting"
      - "/pwnagotchi"
      - "/routellm"
      - "/uv"
      - "/wolverine"
      - "/wtfis"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-3:
        patterns:
          - "*"

  # Directories whose dependencies cannot all be bumped, so each gets ignore
  # rules. The weekly scripts/updatePythonDepsUV.sh still updates the ignored
  # packages, and Dependabot security updates run separately from this file.
  # Ignore rules apply to every directory in an entry, so the names below are
  # only ones that no other directory here needs updated.
  #   awscli: Dependabot reads 1.46.0, "updates" to 1.46.2 and finds the
  #           lock already there ("Expected lockfile to change!").
  #   pshtt:  direct git URL, Dependabot looks for pshtt==0.7.6 on PyPI.
  #   cryptography (pshtt only): resolved against a newer pshtt that needs
  #           sslyze<5, which pins cryptography<42.
  #   rich (sgpt only): shell_gpt pins rich<14.
  #   setuptools >=81 (shodan): shodan's __main__ imports pkg_resources, which
  #           setuptools removed in 81.0.0, so "shodan --help" breaks above
  #           80.x. Upstream fix is in flight at
  #           https://github.com/achillean/shodan-python/pull/253 - drop this
  #           rule once that lands and the pin comes off shodan/pyproject.toml.
  #           It also stops setuptools bumps in pshtt, which weekly locking
  #           still does.
  - package-ecosystem: "uv"
    directories:
      - "/awscli"
      - "/pshtt"
      - "/sgpt"
      - "/shodan"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-pinned:
        patterns:
          - "*"
    ignore:
      - dependency-name: "awscli"
      - dependency-name: "pshtt"
      - dependency-name: "cryptography"
      - dependency-name: "rich"
      - dependency-name: "setuptools"
        versions: [">=81.0.0"]

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/*"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      docker:
        patterns:
          - "*"

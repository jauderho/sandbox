### 20250930195232 ###

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  # Python dependencies. uv.lock and pyproject.toml are the source of truth;
  # dependabot has no way to filter by manifest type, so the few remaining
  # requirements files (the awscli 1.16.14 variant and memray's upstream dev
  # files) are still parsed.
  #
  # shodan is deliberately NOT in this list - it has its own entry below so its
  # setuptools pin can be exempted without suppressing setuptools elsewhere.
  # Any new app directory needs adding here.
  - package-ecosystem: "pip"
    directories:
      - "/ai-hedge-fund"
      - "/aranet4"
      - "/autoflake"
      - "/awscli"
      - "/badkeys"
      - "/bgperf2"
      - "/cantools"
      - "/claude-engineer"
      - "/codespell"
      - "/cryptolyzer"
      - "/datasette"
      - "/deepdiff"
      - "/diagrams"
      - "/dnsdiag"
      - "/dnsrecon"
      - "/dnstwist"
      - "/dnsvalidator"
      - "/finanace_dl"
      - "/gallery-dl"
      - "/greynoise"
      - "/hdbcli"
      - "/huggingface-cli"
      - "/ilab"
      - "/internetarchive"
      - "/jc"
      - "/llama-fs"
      - "/llm"
      - "/memray"
      - "/mlx"
      - "/mlx-hub"
      - "/notdiamond"
      - "/openbbterminal"
      - "/paperless-ngx"
      - "/pip-audit"
      - "/pipenv-poetry-migrate"
      - "/posting"
      - "/prowler"
      - "/pshtt"
      - "/puncia"
      - "/pwnagotchi"
      - "/pyaranet4"
      - "/pyinfra"
      - "/python-matter-server"
      - "/pyupgrade"
      - "/revchatgpt"
      - "/routellm"
      - "/scrapeghost"
      - "/sgpt"
      - "/ssh-mitm"
      - "/uv"
      - "/wolverine"
      - "/wtfis"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"

  # shodan only: its __main__ imports pkg_resources, which setuptools removed in
  # 81.0.0, so "shodan --help" breaks above 80.x. Upstream fix is in flight at
  # https://github.com/achillean/shodan-python/pull/253 - drop this entry once
  # that lands and the pin comes off shodan/pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/shodan"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
    ignore:
      - dependency-name: "setuptools"
        versions: [">=81.0.0"]

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/*"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"

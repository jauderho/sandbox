### 20250930195232 ###

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      actions-deps:
        patterns:
          - "*"

  # Python dependencies. The uv ecosystem reads pyproject.toml and uv.lock,
  # which are the source of truth here. Unlike pip it does not parse
  # requirements files, so the frozen awscli 1.16.14 pin and memray's upstream
  # dev files are no longer updated. Both are meant to stay where they are, so
  # that is the wanted behaviour rather than a gap.
  #
  # shodan is deliberately NOT in this list - it has its own entry below so its
  # setuptools pin can be exempted without suppressing setuptools elsewhere.
  # Any new app directory needs adding to one of the batches.
  #
  # ai-hedge-fund, ilab and python-matter-server are deliberately absent. Their
  # dependencies are the git-sourced package itself or are all held back by its
  # pins, so every Dependabot version update for them failed. The weekly
  # scripts/updatePythonDepsUV.sh still updates their locks.
  #
  # The directories are split into four batches because a single job over all
  # of them ran past the roughly 55 minute limit and was cancelled every day.
  # On 2026-10-27 the 14 smaller batches each finished in 2 to 7 minutes, about
  # 90 seconds of which is fixed start-up. Four batches are expected to take
  # about 10 minutes each, which leaves a wide margin. Add a batch if one starts
  # to approach 30 minutes.
  - package-ecosystem: "uv"
    directories:
      - "/aranet4"
      - "/badkeys"
      - "/cantools"
      - "/codespell"
      - "/diagrams"
      - "/dnsdiag"
      - "/gallery-dl"
      - "/notdiamond"
      - "/openbbterminal"
      - "/routellm"
      - "/ssh-mitm"
      - "/wolverine"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-1:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/autoflake"
      - "/bgperf2"
      - "/deepdiff"
      - "/dnsvalidator"
      - "/finanace_dl"
      - "/internetarchive"
      - "/llm"
      - "/mlx"
      - "/posting"
      - "/puncia"
      - "/pwnagotchi"
      - "/pyupgrade"
      - "/scrapeghost"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-2:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/claude-engineer"
      - "/cryptolyzer"
      - "/datasette"
      - "/dnstwist"
      - "/hdbcli"
      - "/huggingface-cli"
      - "/llama-fs"
      - "/memray"
      - "/prowler"
      - "/pyaranet4"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-3:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/dnsrecon"
      - "/greynoise"
      - "/jc"
      - "/paperless-ngx"
      - "/pyinfra"
      - "/revchatgpt"
      - "/uv"
      - "/wtfis"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-4:
        patterns:
          - "*"

  # Directories whose dependencies are held back by a git-sourced package, so
  # Dependabot cannot bump them, plus awscli. Each ignored name below failed in
  # the 2026-10-27 run; the weekly scripts/updatePythonDepsUV.sh still updates
  # them, and Dependabot security updates run separately from this file.
  #   awscli: Dependabot reads 1.46.0, "updates" to 1.46.2 and finds the
  #           lock already there ("Expected lockfile to change!").
  #   pshtt:  direct git URL, Dependabot looks for pshtt==0.7.6 on PyPI.
  #   cryptography (pshtt only): resolved against a newer pshtt that needs
  #           sslyze<5, which pins cryptography<42.
  #   rich (sgpt only): shell_gpt pins rich<14.
  - package-ecosystem: "uv"
    directories:
      - "/awscli"
      - "/pshtt"
      - "/sgpt"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python-pinned:
        patterns:
          - "*"
    ignore:
      - dependency-name: "awscli"
      - dependency-name: "pshtt"
      - dependency-name: "cryptography"
      - dependency-name: "rich"

  # shodan only: its __main__ imports pkg_resources, which setuptools removed in
  # 81.0.0, so "shodan --help" breaks above 80.x. Upstream fix is in flight at
  # https://github.com/achillean/shodan-python/pull/253 - drop this entry once
  # that lands and the pin comes off shodan/pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/shodan"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      python:
        patterns:
          - "*"
    ignore:
      - dependency-name: "setuptools"
        versions: [">=81.0.0"]

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/*"
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      docker:
        patterns:
          - "*"

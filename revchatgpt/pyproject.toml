[project]
name = "revchatgpt-project"
description = "ChatGPT is a reverse engineering of OpenAI's ChatGPT API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "revChatGPT"
]
dynamic = ["version"]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.23"]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } }
]

[tool.uv.sources]
pypi = { url = "https://pypi.org/simple" }

[dependency-groups]
dev = []

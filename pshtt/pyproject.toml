[project]
name = "pshtt-project"
description = "pshtt (\"pushed\") is a tool to scan domains for HTTPS best practices. It saves its results to a CSV (or JSON) file."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cryptography",
  "typepy[datetime]",
  # Pinned: later fork commits require sslyze<5, whose nassl and pydantic-core
  # releases have no wheels or builds for Python 3.13+, so "uv lock -U" fails.
  "pshtt @ git+https://github.com/jauderho/pshtt.git@e55ea72f78073b00db1902a55b1e094b7b2001cf"
]
dynamic = ["version"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } }
]

[tool.uv.sources]
pypi = { url = "https://pypi.org/simple" }

[dependency-groups]
dev = []

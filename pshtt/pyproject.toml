[project]
name = "pshtt-project"
description = "pshtt (\"pushed\") is a tool to scan domains for HTTPS best practices. It saves its results to a CSV (or JSON) file."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cryptography",
  "typepy[datetime]",
  "pshtt @ git+https://github.com/jauderho/pshtt.git@c177be66d82c148d1f550bf4cc9bac87cfd27fbb"
]
dynamic = ["version"]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.23"]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } }
]

[tool.uv.sources]
pypi = { url = "https://pypi.org/simple" }

[dependency-groups]
dev = []
